name: Generate DroidShell bootstrap archives (android-7)

on:
  workflow_dispatch:

permissions: {} # none

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch:
          - aarch64
          - arm
          - i686
          - x86_64
    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build package builder image
        working-directory: scripts
        run: docker build -t package-builder -f Dockerfile .

      - name: Create bootstrap archive (builds packages from source with the DroidShell prefix)
        run: TERMUX_BUILDER_IMAGE_NAME=package-builder ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures ${{ matrix.arch }}

      - name: Copy bootstrap archive out of the container
        run: |
          # The zip is created in a tmp dir inside the container; the final
          # mv into the mounted repo can fail with permission errors on CI
          # runners, so copy it out with docker cp instead.
          BOOTSTRAP_TMP=$(docker exec termux-package-builder sh -c 'ls -d /tmp/bootstrap-tmp.* 2>/dev/null | head -n 1' || true)
          if [ -n "$BOOTSTRAP_TMP" ] && docker exec termux-package-builder test -f "$BOOTSTRAP_TMP/bootstrap-${{ matrix.arch }}.zip"; then
            docker cp "termux-package-builder:$BOOTSTRAP_TMP/bootstrap-${{ matrix.arch }}.zip" "./bootstrap-${{ matrix.arch }}.zip"
          else
            cp "/home/builder/termux-packages/bootstrap-${{ matrix.arch }}.zip" "./bootstrap-${{ matrix.arch }}.zip" 2>/dev/null || \
              { echo "::error ::bootstrap-${{ matrix.arch }}.zip not found"; exit 1; }
          fi

      - name: Store artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-archives-${{ matrix.arch }}-${{ github.sha }}
          path: "bootstrap-*.zip"

  publish:
    permissions:
      contents: write # for git tag + release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: ./
      - name: Create new tag
        id: get_tag
        run: |
          new_tag="bootstrap-$(date "+%Y.%m.%d")"
          existing_tag_revision=$(git tag -l "${new_tag}-r*+apt.android-7" | sed -nE 's/.*-r([0-9]+)\+apt\.android-7$/\1/p' | sort -n | tail -n 1)
          if [ -n "$existing_tag_revision" ]; then
            tag_rev=$((10#$existing_tag_revision + 1))
          else
            tag_rev=1
          fi
          new_tag="${new_tag}-r${tag_rev}+apt.android-7"
          echo "tag_name=$new_tag" >> $GITHUB_OUTPUT
      - name: Publish bootstrap zips to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.get_tag.outputs.tag_name }} --title "Bootstrap archives for DroidShell application (apt.android-7)"
          for file in $(find . -maxdepth 3 -name "*.zip" -print); do
            gh release upload ${{ steps.get_tag.outputs.tag_name }} "$file"
          done
